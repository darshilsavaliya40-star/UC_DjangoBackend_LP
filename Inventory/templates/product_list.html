<!DOCTYPE html>
<html>
<head>
    <title>ShelfTrack Products</title>
</head>

<body>

    <h1>ShelfTrack Products</h1>

    {% for product in products %}

        <h3>{{ product.name }}</h3>

        <p>Stock: {{ product.stock }}</p>
        <p>Price: ₹{{ product.price }}</p>
        <p>Location: {{ product.location }}</p>

        <hr>

    {% empty %}

        <p>No products available.</p>

    {% endfor %}

</body>
</html>
